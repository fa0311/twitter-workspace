services:
  twitter-workspace:
    build:
      context: ../
      dockerfile: Dockerfile
    env_file:
      - ../.env
    container_name: twitter-workspace
    command: ["/bin/sh", "-c", "sleep infinity"]
    volumes:
      - .:/root/workspace
      - vscode-data:/root/.vscode-server
      - claude-data:/root/.claude
      - tool-cache:/root/.cache
      - tool-local:/root/.local
      - ${HOME}/.zshrc:/root/.zshrc:ro
      - ${HOME}/.ssh:/root/.ssh:ro
      - ${HOME}/.config/gh:/root/.config/gh:ro
      - ${HOME}/.gnupg/private-keys-v1.d:/root/.gnupg/private-keys-v1.d:ro
      - ${HOME}/.gnupg/pubring.kbx:/root/.gnupg/pubring.kbx:ro
      - ${HOME}/.gnupg/trustdb.gpg:/root/.gnupg/trustdb.gpg:ro
    stdin_open: true
    tty: true

volumes:
  vscode-data:
  claude-data:
  tool-cache:
  tool-local:
